<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>創業星系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Noto+Serif+TC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#080D1F;--parchment:#EDE6D3;--dim:#9A9683;--brass:#C9A227;
    --line:rgba(237,230,211,.16);
    --display:"Noto Serif TC",serif;--latin:"Cormorant Garamond",serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--parchment);font-family:var(--display);
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body.locked{overflow:hidden}

  .starfield{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
  .starfield i{position:absolute;width:1px;height:1px;background:var(--parchment);border-radius:50%}

  /* ── 星系總覽 ───────────────────────── */
  .system{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:clamp(20px,4vw,52px)}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:clamp(8px,2vw,20px)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin:0 0 10px}
  h1{font-weight:600;font-size:clamp(30px,5.4vw,50px);letter-spacing:.14em;margin:0;line-height:1.1}
  h1 em{font-family:var(--latin);font-style:italic;font-weight:300;color:var(--dim);
    letter-spacing:.02em;font-size:.46em;display:block;margin-top:10px}

  .chart{padding:6% 6% 3%}
  .stage{position:relative;width:100%;aspect-ratio:1/1;overflow:visible}
  .orbits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .orbits circle{fill:none;stroke:var(--line);stroke-width:.16}
  .sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;
    border-radius:50%;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 38% 34%,#F6ECC8,#C9A227 58%,#7A5F12);
    box-shadow:0 0 0 1px rgba(201,162,39,.4),0 0 54px 10px rgba(201,162,39,.2)}
  .sun-label{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + 11%));z-index:2;
    pointer-events:none;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--brass);white-space:nowrap}

  .planet{position:absolute;z-index:3;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;
    cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:9px}
  .planet::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(56px,118%);height:max(56px,118%);border-radius:50%}
  .planet .body{width:var(--size);aspect-ratio:1;border-radius:50%;background:var(--fill);
    box-shadow:inset -5px -6px 16px rgba(0,0,0,.5),0 0 0 1px rgba(237,230,211,.2);
    transition:box-shadow .3s ease,transform .3s cubic-bezier(.2,.7,.3,1)}
  .planet .tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap;transition:color .25s}
  .planet:hover .body,.planet:focus-visible .body{transform:scale(1.09);
    box-shadow:inset -5px -6px 16px rgba(0,0,0,.5),0 0 0 1px var(--accent),0 0 34px 6px var(--glow)}
  .planet:hover .tag,.planet:focus-visible .tag{color:var(--parchment)}
  .planet:focus{outline:none}
  .planet:focus-visible{outline:2px solid var(--brass);outline-offset:10px;border-radius:8px}

  .system-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
  .toggle{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
    font-size:10.5px;letter-spacing:.14em;padding:7px 13px;border-radius:2px;cursor:pointer;transition:.2s}
  .toggle:hover{border-color:var(--brass);color:var(--brass)}
  .toggle:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  /* ── 單一宇宙 ───────────────────────── */
  .universe{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--ink);
    opacity:0;visibility:hidden;transition:opacity .38s ease,visibility .38s}
  .universe.on{opacity:1;visibility:visible}
  .universe::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(60% 55% at 26% 40%,var(--halo),transparent 68%)}

  .u-bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:18px clamp(20px,5vw,56px);background:linear-gradient(180deg,var(--ink) 62%,transparent);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--dim)}
  .back{background:none;border:0;padding:8px 0;color:var(--parchment);cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;display:flex;align-items:center;gap:10px}
  .back:hover{color:var(--accent)}
  .back:focus-visible{outline:2px solid var(--brass);outline-offset:4px}

  .u-body{position:relative;z-index:2;max-width:1080px;margin:0 auto;
    padding:clamp(8px,2vw,24px) clamp(20px,5vw,56px) clamp(56px,9vw,110px);
    display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(30px,5vw,64px);align-items:center}
  @media (max-width:860px){.u-body{grid-template-columns:1fr;gap:38px}}

  /* 行星＋衛星 */
  .u-orb{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto;overflow:visible;
    transform:scale(.88);opacity:0;transition:transform .7s cubic-bezier(.2,.75,.3,1),opacity .5s ease}
  .universe.on .u-orb{transform:scale(1);opacity:1}
  .u-rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .u-rings circle{fill:none;stroke:var(--line);stroke-width:.2}
  .u-orb .disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:52%;aspect-ratio:1;border-radius:50%;background:var(--fill);
    box-shadow:inset -12px -16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(237,230,211,.2),0 0 70px 12px var(--glow)}

  .moon{position:absolute;z-index:4;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;
    cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
  .moon::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(48px,150%);height:max(48px,150%);border-radius:50%}
  .moon .ball{width:11%;min-width:20px;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 36% 32%,#F2ECDC,#9A9683 60%,#4A483F);
    box-shadow:0 0 0 1px rgba(237,230,211,.25);transition:transform .25s,box-shadow .25s}
  .moon .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);
    white-space:nowrap;transition:color .25s}
  .moon:hover .ball,.moon:focus-visible .ball{transform:scale(1.22);
    box-shadow:0 0 0 1px var(--accent),0 0 18px 3px var(--glow)}
  .moon:hover .lbl,.moon:focus-visible .lbl{color:var(--parchment)}
  .moon[aria-pressed="true"] .ball{transform:scale(1.25);box-shadow:0 0 0 2px var(--accent),0 0 22px 5px var(--glow)}
  .moon[aria-pressed="true"] .lbl{color:var(--accent)}
  .moon:focus{outline:none}
  .moon:focus-visible{outline:2px solid var(--brass);outline-offset:8px;border-radius:6px}

  /* 文字 */
  .u-text{max-width:56ch}
  .u-idx{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--accent);margin:0 0 16px}
  .u-text h2{font-size:clamp(28px,4.6vw,42px);font-weight:600;letter-spacing:.07em;margin:0 0 6px;line-height:1.2}
  .u-en{font-family:var(--latin);font-style:italic;font-weight:300;font-size:clamp(17px,2.2vw,21px);color:var(--dim);margin:0 0 26px}
  .u-lede{font-size:clamp(15px,1.7vw,16.5px);line-height:2;margin:0 0 30px;color:rgba(237,230,211,.92)}
  .u-text dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:baseline;
    border-top:1px solid var(--line);padding-top:24px}
  .u-text dt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);white-space:nowrap;padding-top:3px}
  .u-text dd{margin:0;font-size:15px;line-height:1.75}

  /* 衛星面板 */
  .sat{grid-column:1/-1;border-top:1px solid var(--line);padding-top:30px;min-height:150px}
  .sat-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .sat-head h3{font-size:19px;font-weight:600;letter-spacing:.08em;margin:0}
  .sat-head .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent)}
  .sat-note{font-size:13.5px;line-height:1.85;color:var(--dim);margin:-10px 0 22px;max-width:62ch}
  .sat ul{list-style:none;margin:0;padding:0;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .sat li{background:var(--ink);padding:15px 17px;display:flex;gap:12px;align-items:flex-start;
    font-size:14.5px;line-height:1.65}
  .sat li .mark{font-family:var(--mono);font-size:10px;color:var(--accent);padding-top:4px;flex:none}
  .sat .prompt{color:var(--dim);font-family:var(--latin);font-style:italic;font-size:19px}
  .sat .prompt span{display:block;font-family:var(--display);font-style:normal;font-size:14px;letter-spacing:.05em;margin-top:12px}

  /* 排程網格 */
  .sched{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);list-style:none;padding:0}
  .sched li{background:var(--ink);padding:12px 15px;display:flex;align-items:baseline;gap:10px}
  .sched .date{font-family:var(--mono);font-size:12px;color:var(--parchment)}
  .sched .dow{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .sched .kind{margin-left:auto;font-size:13px}
  .sched li.post .kind{color:var(--accent);font-weight:600}
  .sched li.reel .kind{color:var(--dim)}
  .sched li.done{opacity:.36}
  .sched li.today{background:rgba(237,230,211,.06);box-shadow:inset 2px 0 0 var(--accent)}
  .sched li.today .dow::after{content:" · 今天";color:var(--accent)}

  @media (prefers-reduced-motion:reduce){
    .planet .body,.moon .ball,.u-orb{transition:none}
    .u-orb{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="starfield" id="stars" aria-hidden="true"></div>

<main class="system">
  <header>
    <p class="eyebrow">Observation Chart · 2026</p>
    <h1>創業星系<em>everything Ray is orbiting right now</em></h1>

</main>

<section class="universe" id="universe" role="dialog" aria-modal="true" aria-labelledby="u-title" tabindex="-1">
  <div class="u-bar">
    <button class="back" id="back" type="button"><span aria-hidden="true">←</span> 返回星系</button>
    <span id="u-orbit"></span>
  </div>
  <div class="u-body">
    <div class="u-orb" id="u-orb">
      <svg class="u-rings" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="46.5"/>

    <div class="u-text">
      <p class="u-idx" id="u-idx"></p>

      <p class="u-en" id="u-en"></p>
      <p class="u-lede" id="u-lede"></p>
      <dl id="u-meta"></dl>

    <div class="sat" id="u-sat"></div>
  </div>
</section>

      meta:[["通路","Gumroad"],["用途","課堂即時複習"],["現況","已上架販售"],["下一步","行銷素材與教師版說明"]],
      sat:{
        todo:["教師版說明文件","商品頁行銷素材更新"],
        routine:["Gumroad 訂單查看","課堂實測後收集回饋"],
        future:["自訂題庫匯入","英文介面版本"],
        money:["通路：Gumroad","模式：一次性買斷","銷售數字：待填"]
      }
    },
    {
      id:"nz", tag:"NZ 2027", name:"紐西蘭打工度假", en:"Departure ≈ May–June 2027",
      r:48, size:"8.5%", angle:334, speed:0.07,
      accent:"#EDE6D3", glow:"rgba(237,230,211,.28)", halo:"rgba(237,230,211,.12)",
      fill:"radial-gradient(circle at 34% 30%,#F6F1E3,#8E8A76 58%,#35332C)",
      lede:"最外圈、也最慢的一顆。簽證已核准，剩下的是落地金和出發前的幾趟行程——每多一趟，落地金的存錢節奏就得往前擠一次。它其實決定了其他星球在 2027 年之前要各自跑到哪個階段。",
      meta:[["狀態","簽證已核准"],["落地金","目標約 NT$150,000"],["節奏","每月約 NT$20,000"],["出發前","新加坡 F1、名古屋、北海道"],["未定","澳洲一趟"]],
      sat:{
        todo:["落地金試算更新","北海道行程與預算","澳洲行程去留評估"],
        routine:["每月存入約 NT$20,000","自主支出管控檢查"],
        future:["2027 年 5–6 月出發","抵達後找工作","車輛採購（不含在落地金內）"],
        money:["這顆是支出項，不是收入項","目標落地金：約 NT$150,000","每多一趟行程，存錢節奏就得往前擠"]
      },
      satNote:{ todo:"澳洲那筆先當作可選項。決定去或不去，會直接改變前面兩項的數字。" }
    }
  ];

  var stage = document.getElementById("stage");
  var uni   = document.getElementById("universe");
  var orb   = document.getElementById("u-orb");
  var satBox= document.getElementById("u-sat");
  var toggle= document.getElementById("toggle");
  var back  = document.getElementById("back");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lastFocus = null, current = null, currentSat = null;

  (function(){
    var box = document.getElementById("stars"), h = "";
    for (var i=0;i<150;i++){
      h += '<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)
        +'%;opacity:'+(0.15+Math.random()*0.7).toFixed(2)+'"></i>';
    }
    box.innerHTML = h;
  })();

  /* 行星 */
  var nodes = PLANETS.map(function(p){
    var b = document.createElement("button");
    b.type = "button"; b.className = "planet"; b.dataset.id = p.id;
    b.setAttribute("aria-label", p.name + "，進入");
    b.style.setProperty("--size", p.size);
    b.style.setProperty("--fill", p.fill);
    b.style.setProperty("--accent", p.accent);
    b.style.setProperty("--glow", p.glow);
    b.innerHTML = '<span class="body"></span><span class="tag">'+p.tag+'</span>';
    stage.appendChild(b);
    return b;
  });

  /* 衛星 */
  var moonState = SATS.map(function(s,i){
    return { key:s.key, r: (i%2 ? 46.5 : 40), angle: 42 + i*90, speed: 0.13 + i*0.035 };
  });
  var moonNodes = SATS.map(function(s,i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "moon"; b.dataset.key = s.key;
    b.setAttribute("aria-pressed","false");
    b.setAttribute("aria-label", s.title);
    b.innerHTML = '<span class="ball"></span><span class="lbl">'+s.label+'</span>';
    orb.appendChild(b);
    return b;
  });

  function placeAll(){
    PLANETS.forEach(function(p,i){
      var a = p.angle*Math.PI/180;
      nodes[i].style.left = (50 + p.r*Math.cos(a)).toFixed(3)+"%";
      nodes[i].style.top  = (50 + p.r*Math.sin(a)).toFixed(3)+"%";
    });
    moonState.forEach(function(m,i){
      var a = m.angle*Math.PI/180;
      moonNodes[i].style.left = (50 + m.r*Math.cos(a)).toFixed(3)+"%";
      moonNodes[i].style.top  = (50 + m.r*Math.sin(a)).toFixed(3)+"%";
    });
  }
  placeAll();

  var running = !reduced, overStage = false, overOrb = false, open = false, last = 0;
  function frame(t){
    if(!last) last = t;
    var dt = Math.min(t-last,50); last = t;
    if(running){
      if(!open && !overStage){
        PLANETS.forEach(function(p){ p.angle = (p.angle + p.speed*dt/16.7) % 360; });
      }
      if(open && !overOrb && !currentSat){
        moonState.forEach(function(m){ m.angle = (m.angle + m.speed*dt/16.7) % 360; });
      }
      placeAll();
    }
    requestAnimationFrame(frame);
  }
  if(!reduced) requestAnimationFrame(frame);

  stage.addEventListener("pointerenter", function(){ overStage = true; });
  stage.addEventListener("pointerleave", function(){ overStage = false; });
  orb.addEventListener("pointerenter", function(){ overOrb = true; });
  orb.addEventListener("pointerleave", function(){ overOrb = false; });

  toggle.addEventListener("click", function(){
    running = !running;
    toggle.textContent = running ? "暫停公轉" : "恢復公轉";
  });
  if(reduced){ toggle.disabled = true; toggle.textContent = "已停用動態"; }

  stage.addEventListener("click", function(e){
    var btn = e.target.closest(".planet");
    if(!btn) return;
    var p = PLANETS.filter(function(x){ return x.id === btn.dataset.id; })[0];
    if(p){ lastFocus = btn; enter(p); }
  });

  orb.addEventListener("click", function(e){
    var btn = e.target.closest(".moon");
    if(!btn) return;
    selectSat(btn.dataset.key === currentSat ? null : btn.dataset.key);
  });

  function enter(p){
    current = p;
    var i = PLANETS.indexOf(p) + 1;
    ["fill","accent","glow","halo"].forEach(function(k){ uni.style.setProperty("--"+k, p[k]); });

    document.getElementById("u-idx").textContent   = "軌道 " + pad(i) + " / " + PLANETS.length;
    document.getElementById("u-orbit").textContent = pad(i) + " — " + p.tag;
    document.getElementById("u-title").textContent = p.name;
    document.getElementById("u-en").textContent    = p.en;
    document.getElementById("u-lede").textContent  = p.lede;

    var dl = document.getElementById("u-meta");
    dl.innerHTML = "";
    p.meta.forEach(function(m){
      var dt = document.createElement("dt"); dt.textContent = m[0];
      var dd = document.createElement("dd"); dd.textContent = m[1];
      dl.appendChild(dt); dl.appendChild(dd);
    });

    selectSat(null);
    open = true;
    uni.classList.add("on");
    document.body.classList.add("locked");
    uni.scrollTop = 0;
    uni.focus();
  }

  function selectSat(key){
    currentSat = key;
    moonNodes.forEach(function(n){ n.setAttribute("aria-pressed", String(n.dataset.key === key)); });

    if(!key){
      satBox.innerHTML = '<p class="prompt">Four moons.<span>點行星旁邊的小衛星：待辦、定期、未來、收益。</span></p>';
      return;
    }
    var meta = SATS.filter(function(s){ return s.key === key; })[0];
    var items = (current.sat && current.sat[key]) || [];
    var note  = (current.satNote && current.satNote[key]) || "";

    var html = '<div class="sat-head"><span class="kicker">'+meta.label+'</span><h3>'+meta.title+'</h3></div>';
    if(note) html += '<p class="sat-note">'+esc(note)+'</p>';
    if(items.length){
      html += '<ul>' + items.map(function(it){
        return '<li><span class="mark">'+meta.mark+'</span><span>'+esc(it)+'</span></li>';
      }).join("") + '</ul>';
    } else {
      html += '<p class="sat-note">這顆衛星還沒有內容。</p>';
    }
    if(key === "routine" && current.schedule && current.schedule.length){
      html += scheduleHtml(current.schedule);
    }
    satBox.innerHTML = html;
  }

  var DOW = ["日","一","二","三","四","五","六"];
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function todayKey(){
    var n = new Date();
    return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate());
  }
  function scheduleHtml(list){
    var today = todayKey();
    return '<ul class="sched">' + list.map(function(s){
      var q = s.d.split("-");
      var dt = new Date(+q[0], +q[1]-1, +q[2]);
      var cls = (s.t === "貼文" ? "post" : "reel");
      if(s.d === today) cls += " today"; else if(s.d < today) cls += " done";
      return '<li class="'+cls+'"><span class="date">'+(+q[1])+"/"+(+q[2])+'</span>'
           + '<span class="dow">週'+DOW[dt.getDay()]+'</span>'
           + '<span class="kind">'+esc(s.t)+'</span></li>';
    }).join("") + '</ul>';
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function exit(){
    open = false; currentSat = null;
    uni.classList.remove("on");
    document.body.classList.remove("locked");
    if(lastFocus) lastFocus.focus();
  }

  back.addEventListener("click", exit);
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape" || !open) return;
    if(currentSat) selectSat(null); else exit();
  });
})();
</script>
</body>
</html>
