<title>創業星系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Noto+Serif+TC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style id="css">
  :root{
    --ink:#080D1F;--parchment:#EDE6D3;--dim:#9A9683;--brass:#C9A227;
    --line:rgba(237,230,211,.16);
    --display:"Noto Serif TC",serif;--latin:"Cormorant Garamond",serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--parchment);font-family:var(--display);
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body.locked{overflow:hidden}

  .starfield{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
  .starfield i{position:absolute;width:1px;height:1px;background:var(--parchment);border-radius:50%}

  /* ── 星系總覽 ───────────────────────── */
  .system{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:clamp(20px,4vw,52px)}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:clamp(8px,2vw,20px)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin:0 0 10px}
  h1{font-weight:600;font-size:clamp(30px,5.4vw,50px);letter-spacing:.14em;margin:0;line-height:1.1}
  h1 em{font-family:var(--latin);font-style:italic;font-weight:300;color:var(--dim);
    letter-spacing:.02em;font-size:.46em;display:block;margin-top:10px}

  .chart{padding:6% 6% 3%}
  .stage{position:relative;width:100%;aspect-ratio:1/1;overflow:visible}
  .orbits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .orbits circle{fill:none;stroke:var(--line);stroke-width:.16}
  .sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;
    border-radius:50%;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 38% 34%,#F6ECC8,#C9A227 58%,#7A5F12);
    box-shadow:0 0 0 1px rgba(201,162,39,.4),0 0 54px 10px rgba(201,162,39,.2)}
  .sun-label{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + 11%));z-index:2;
    pointer-events:none;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--brass);white-space:nowrap}

  /* 寬度要吃星圖的百分比，所以尺寸掛在按鈕上，標籤用絕對定位掛在下面，才不會把按鈕撐開 */
  .planet{position:absolute;z-index:3;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;
    cursor:pointer;color:inherit;font:inherit;display:block;width:var(--size);aspect-ratio:1}
  .planet::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(56px,118%);height:max(56px,118%);border-radius:50%}
  .planet .body{position:relative;display:block;width:100%;height:100%;border-radius:50%;background:var(--fill);
    box-shadow:inset -5px -6px 16px rgba(0,0,0,.5),0 0 0 1px rgba(237,230,211,.2);
    transition:box-shadow .3s ease,transform .3s cubic-bezier(.2,.7,.3,1)}
  .planet .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:9px;
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap;transition:color .25s}
  .planet:hover .body,.planet:focus-visible .body{transform:scale(1.09);
    box-shadow:inset -5px -6px 16px rgba(0,0,0,.5),0 0 0 1px var(--accent),0 0 34px 6px var(--glow)}
  .planet:hover .tag,.planet:focus-visible .tag{color:var(--parchment)}
  .planet:focus{outline:none}
  .planet:focus-visible{outline:2px solid var(--brass);outline-offset:10px;border-radius:50%}
  .planet .badge{position:absolute;right:0;top:0;transform:translate(40%,-40%);
    font-family:var(--mono);font-size:9.5px;line-height:1;color:var(--ink);background:var(--accent);
    min-width:16px;height:16px;padding:0 4px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    box-shadow:0 0 0 2px var(--ink)}

  .system-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
  .toggle{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
    font-size:10.5px;letter-spacing:.14em;padding:7px 13px;border-radius:2px;cursor:pointer;transition:.2s}
  .toggle:hover{border-color:var(--brass);color:var(--brass)}
  .toggle:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  /* ── 單一宇宙 ───────────────────────── */
  .universe{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--ink);
    opacity:0;visibility:hidden;transition:opacity .38s ease,visibility .38s}
  .universe.on{opacity:1;visibility:visible}
  .universe::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(60% 55% at 26% 40%,var(--halo),transparent 68%)}

  .u-bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:18px clamp(20px,5vw,56px);background:linear-gradient(180deg,var(--ink) 62%,transparent);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--dim)}
  .back{background:none;border:0;padding:8px 0;color:var(--parchment);cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;display:flex;align-items:center;gap:10px}
  .back:hover{color:var(--accent)}
  .back:focus-visible{outline:2px solid var(--brass);outline-offset:4px}

  .u-body{position:relative;z-index:2;max-width:1080px;margin:0 auto;
    padding:clamp(8px,2vw,24px) clamp(20px,5vw,56px) clamp(56px,9vw,110px);
    display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(30px,5vw,64px);align-items:center}
  @media (max-width:860px){.u-body{grid-template-columns:1fr;gap:38px}}

  /* 行星＋衛星 */
  .u-orb{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto;overflow:visible;
    transform:scale(.88);opacity:0;transition:transform .7s cubic-bezier(.2,.75,.3,1),opacity .5s ease}
  .universe.on .u-orb{transform:scale(1);opacity:1}
  .u-rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .u-rings circle{fill:none;stroke:var(--line);stroke-width:.2}
  .u-orb .disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:52%;aspect-ratio:1;border-radius:50%;background:var(--fill);
    box-shadow:inset -12px -16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(237,230,211,.2),0 0 70px 12px var(--glow)}

  .moon{position:absolute;z-index:4;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;
    cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
  .moon::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(48px,150%);height:max(48px,150%);border-radius:50%}
  .moon .ball{width:11%;min-width:20px;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 36% 32%,#F2ECDC,#9A9683 60%,#4A483F);
    box-shadow:0 0 0 1px rgba(237,230,211,.25);transition:transform .25s,box-shadow .25s}
  .moon .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);
    white-space:nowrap;transition:color .25s}
  .moon .lbl b{font-weight:400;color:var(--accent);margin-left:4px}
  .moon:hover .ball,.moon:focus-visible .ball{transform:scale(1.22);
    box-shadow:0 0 0 1px var(--accent),0 0 18px 3px var(--glow)}
  .moon:hover .lbl,.moon:focus-visible .lbl{color:var(--parchment)}
  .moon[aria-pressed="true"] .ball{transform:scale(1.25);box-shadow:0 0 0 2px var(--accent),0 0 22px 5px var(--glow)}
  .moon[aria-pressed="true"] .lbl{color:var(--accent)}
  .moon:focus{outline:none}
  .moon:focus-visible{outline:2px solid var(--brass);outline-offset:8px;border-radius:6px}

  /* 文字 */
  .u-text{max-width:56ch}
  .u-idx{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--accent);margin:0 0 16px}
  .u-text h2{font-size:clamp(28px,4.6vw,42px);font-weight:600;letter-spacing:.07em;margin:0 0 6px;line-height:1.2}
  .u-en{font-family:var(--latin);font-style:italic;font-weight:300;font-size:clamp(17px,2.2vw,21px);color:var(--dim);margin:0 0 26px}
  .u-lede{font-size:clamp(15px,1.7vw,16.5px);line-height:2;margin:0 0 30px;color:rgba(237,230,211,.92)}
  .u-text dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:baseline;
    border-top:1px solid var(--line);padding-top:24px}
  .u-text dt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);white-space:nowrap;padding-top:3px}
  .u-text dd{margin:0;font-size:15px;line-height:1.75}

  /* 衛星面板 */
  .sat{grid-column:1/-1;border-top:1px solid var(--line);padding-top:30px;min-height:150px}
  .sat-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .sat-head h3{font-size:19px;font-weight:600;letter-spacing:.08em;margin:0}
  .sat-head .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent)}
  .sat-head .ebtn{margin-left:auto}
  .sat-note{font-size:13.5px;line-height:1.85;color:var(--dim);margin:-10px 0 22px;max-width:62ch}
  .sat ul{list-style:none;margin:0;padding:0;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .sat ul.is-edit{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .sat li{background:var(--ink);padding:15px 17px;display:flex;gap:12px;align-items:flex-start;
    font-size:14.5px;line-height:1.65}
  .sat li .mark{font-family:var(--mono);font-size:10px;color:var(--accent);padding-top:4px;flex:none}
  .sat li .txt{min-width:0;overflow-wrap:anywhere}
  .sat li.done .txt{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(237,230,211,.34)}
  .sat li.done .mark{color:var(--dim)}
  .sat .prompt{color:var(--dim);font-family:var(--latin);font-style:italic;font-size:19px}
  .sat .prompt span{display:block;font-family:var(--display);font-style:normal;font-size:14px;letter-spacing:.05em;margin-top:12px}

  /* 編輯 */
  .ebtn{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
    font-size:10px;letter-spacing:.16em;padding:6px 12px;border-radius:2px;cursor:pointer;transition:.2s}
  .ebtn:hover{border-color:var(--brass);color:var(--brass)}
  .ebtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .ebtn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  .sat li button.mark{background:none;border:0;cursor:pointer;line-height:1.65;
    padding:4px 3px 0;margin:0 -3px 0 0;border-radius:2px;transition:color .2s,background .2s}
  .sat li button.mark:hover{color:var(--parchment);background:rgba(237,230,211,.09)}
  .sat li button.mark:focus-visible{outline:1px solid var(--brass);outline-offset:2px}

  .sat li textarea{flex:1 1 auto;min-width:0;background:transparent;border:0;
    border-bottom:1px solid var(--line);color:var(--parchment);
    font-family:var(--display);font-size:14.5px;line-height:1.65;
    padding:0 0 5px;margin:0;resize:none;overflow:hidden}
  .sat li textarea:focus{outline:none;border-bottom-color:var(--accent)}
  .sat li.done textarea{color:var(--dim)}

  .rowbtns{display:flex;gap:1px;flex:none;margin-left:2px}
  .rowbtns button{background:none;border:0;color:var(--dim);font-family:var(--mono);
    font-size:12px;line-height:1;padding:5px 6px;cursor:pointer;border-radius:2px;transition:.2s}
  .rowbtns button:hover{color:var(--parchment);background:rgba(237,230,211,.09)}
  .rowbtns .rm:hover{color:#E09070}
  .rowbtns .rm.armed{color:#E09070;background:rgba(224,144,112,.14);
    font-size:10px;letter-spacing:.1em;padding:5px 8px}
  .rowbtns button:focus-visible{outline:1px solid var(--brass);outline-offset:1px}

  .addrow{margin-top:16px}
  .add{width:100%;background:none;border:1px dashed var(--line);color:var(--dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;padding:13px;cursor:pointer;transition:.2s}
  .add:hover{border-color:var(--brass);color:var(--brass)}
  .add:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* 排程網格 */
  .sched{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);list-style:none;padding:0}
  .sched li{background:var(--ink);padding:12px 15px;display:flex;align-items:baseline;gap:10px}
  .sched .date{font-family:var(--mono);font-size:12px;color:var(--parchment)}
  .sched .dow{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .sched .kind{margin-left:auto;font-size:13px}
  .sched li.post .kind{color:var(--accent);font-weight:600}
  .sched li.reel .kind{color:var(--dim)}
  .sched li.done{opacity:.36}
  .sched li.today{background:rgba(237,230,211,.06);box-shadow:inset 2px 0 0 var(--accent)}
  .sched li.today .dow::after{content:" · 今天";color:var(--accent)}

  /* 儲存列 */
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
    align-items:center;gap:12px;flex-wrap:wrap;
    padding:13px clamp(16px,4vw,44px);
    background:var(--ink);border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;letter-spacing:.13em;color:var(--dim)}
  .savebar.on{display:flex}
  .savebar .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}
  .savebar .spacer{margin-left:auto}
  .savebar button{font-family:var(--mono);font-size:11px;letter-spacing:.15em;
    border-radius:2px;cursor:pointer;transition:.2s}
  .savebar .discard{background:none;border:1px solid var(--line);color:var(--dim);padding:9px 14px}
  .savebar .discard:hover{border-color:var(--dim);color:var(--parchment)}
  .savebar .save{background:var(--brass);border:1px solid var(--brass);color:#150F00;padding:9px 20px}
  .savebar .save:hover{background:#DDB52C;border-color:#DDB52C}
  .savebar button[disabled]{opacity:.45;cursor:default}
  .savebar button:focus-visible{outline:2px solid var(--parchment);outline-offset:2px}
  body.dirty .u-body{padding-bottom:130px}
  body.dirty .system{padding-bottom:130px}

  .flash{position:fixed;left:50%;top:18px;transform:translate(-50%,-14px);z-index:70;
    background:rgba(8,13,31,.96);border:1px solid var(--line);color:var(--parchment);
    font-family:var(--mono);font-size:11px;letter-spacing:.13em;padding:10px 18px;border-radius:2px;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:88vw;text-align:center}
  .flash.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    .planet .body,.moon .ball,.u-orb,.flash{transition:none}
    .u-orb{opacity:1;transform:none}
  }
</style>

<div id="mount"></div>

<script type="text/html" id="markup">
<div class="starfield" id="stars" aria-hidden="true"></div>

<main class="system">
  <header>
    <p class="eyebrow">Observation Chart · 2026</p>
    <h1>創業星系<em>everything Ray is orbiting right now</em></h1>
  </header>

  <div class="chart">
    <div class="stage" id="stage">
      <svg class="orbits" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="17"/><circle cx="50" cy="50" r="25"/><circle cx="50" cy="50" r="33"/>
        <circle cx="50" cy="50" r="39.5"/><circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="48"/>
      </svg>
      <div class="sun" aria-hidden="true"></div>
      <div class="sun-label" aria-hidden="true">RAY 雷康誠</div>
    </div>
  </div>

  <div class="system-foot">
    <span id="hint">點任一顆星球進入</span>
    <button class="toggle" id="toggle" type="button">暫停公轉</button>
  </div>
</main>

<section class="universe" id="universe" role="dialog" aria-modal="true" aria-labelledby="u-title" tabindex="-1">
  <div class="u-bar">
    <button class="back" id="back" type="button"><span aria-hidden="true">←</span> 返回星系</button>
    <span id="u-orbit"></span>
  </div>
  <div class="u-body">
    <div class="u-orb" id="u-orb">
      <svg class="u-rings" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="46.5"/>
      </svg>
      <div class="disc" aria-hidden="true"></div>
    </div>
    <div class="u-text">
      <p class="u-idx" id="u-idx"></p>
      <h2 id="u-title"></h2>
      <p class="u-en" id="u-en"></p>
      <p class="u-lede" id="u-lede"></p>
      <dl id="u-meta"></dl>
    </div>
    <div class="sat" id="u-sat"></div>
  </div>
</section>

<div class="savebar" id="savebar">
  <span class="dot" aria-hidden="true"></span>
  <span id="savemsg" aria-live="polite">有還沒存起來的修改</span>
  <span class="spacer"></span>
  <button type="button" class="discard" id="discardbtn">還原</button>
  <button type="button" class="save" id="savebtn">儲存</button>
</div>

<div class="flash" id="flash" aria-live="polite"></div>
</script>

  function setEditing(on){
    editing = on;
    try{ localStorage.setItem("galaxy:editing", on ? "1" : "0"); }catch(e){}
    renderSat();
  }

  function markDirty(){
    dirty = true;
    document.body.classList.add("dirty");
    savebar.classList.add("on");
    savemsg.textContent = "有還沒存起來的修改";
    savebtn.disabled = false;
  }

  satBox.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn || !current) return;

    if(btn.id === "edtoggle"){ setEditing(!editing); return; }

    if(btn.id === "additem"){
      listOf(current.id, currentSat).push({t:"", done:false});
      markDirty(); renderSat();
      var tas = satBox.querySelectorAll("textarea");
      if(tas.length) tas[tas.length-1].focus();
      return;
    }

    var li = btn.closest("li[data-i]");
    if(!li) return;
    var i = +li.dataset.i, arr = listOf(current.id, currentSat), act = btn.dataset.act;
    if(!arr[i]) return;

    if(act === "chk"){
      arr[i].done = !arr[i].done;
      markDirty(); renderSat(); paintBadges(); return;
    }
    if(act === "up" && i > 0){
      arr.splice(i-1, 0, arr.splice(i,1)[0]); markDirty(); renderSat(); return;
    }
    if(act === "dn" && i < arr.length-1){
      arr.splice(i+1, 0, arr.splice(i,1)[0]); markDirty(); renderSat(); return;
    }
    if(act === "rm"){
      if(pendingDel !== i){
        pendingDel = i;
        Array.prototype.forEach.call(satBox.querySelectorAll('[data-act="rm"]'), function(b){
          b.textContent = "✕"; b.classList.remove("armed");
        });
        btn.textContent = "確定刪除"; btn.classList.add("armed");
        return;
      }
      arr.splice(i,1); pendingDel = -1;
      markDirty(); renderSat(); paintBadges();
    }
  });

  satBox.addEventListener("input", function(e){
    var ta = e.target;
    if(!ta || ta.tagName !== "TEXTAREA" || !current) return;
    var arr = listOf(current.id, currentSat), i = +ta.dataset.i;
    if(!arr[i]) return;
    arr[i].t = ta.value;
    grow(ta);
    markDirty();
    if(currentSat === "todo") paintBadges();
  });

  /* ── 存檔 ───────────────────────── */
  function tidy(){
    Object.keys(STATE.sat).forEach(function(pid){
      var bag = STATE.sat[pid];
      Object.keys(bag).forEach(function(k){
        if(!Array.isArray(bag[k])) return;
        bag[k] = bag[k]
          .map(function(it){ return {t: String(it.t).trim(), done: !!it.done}; })
          .filter(function(it){ return it.t; });
      });
    });
  }

  function buildDoc(state){
    var css    = document.getElementById("css").textContent;
    var markup = document.getElementById("markup").textContent;
    var app    = document.getElementById("app").textContent;
    var font   = document.getElementById("fontcss").getAttribute("href").replace(/&/g, "&amp;");
    var json   = JSON.stringify(state).replace(/</g, "\\u003c");
    var OPEN = "<" + "script", CLOSE = "<" + "/script>";
    return '<!doctype html>\n<html lang="zh-Hant">\n<head>\n'
      + '<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
      + '<title>創業星系</title>\n'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
      + '<link id="fontcss" href="' + font + '" rel="stylesheet">\n'
      + '<style id="css">' + css + '</style>\n'
      + '</head>\n<body>\n'
      + '<div id="mount"></div>\n'
      + OPEN + ' type="text/html" id="markup">' + markup + CLOSE + '\n'
      + OPEN + ' type="application/json" id="state">' + json + CLOSE + '\n'
      + OPEN + ' id="app">' + app + CLOSE + '\n'
      + '</body>\n</html>\n';
  }

  function flash(msg){
    flashEl.textContent = msg;
    flashEl.classList.add("on");
    clearTimeout(flash.t);
    flash.t = setTimeout(function(){ flashEl.classList.remove("on"); }, 3600);
  }

  function readOnly(msg){
    canWrite = false; editing = false;
    savebar.classList.remove("on");
    document.body.classList.remove("dirty");
    renderSat();
    flash(msg || "這個檢視只能看，不能存檔");
  }

  function save(){
    if(saving || !api) return;
    saving = true;
    savebtn.disabled = true; discard.disabled = true;
    savemsg.textContent = "儲存中…";

    tidy();
    paintBadges();

    try{
      sessionStorage.setItem("galaxy:view", JSON.stringify({
        p: current ? current.id : null, s: currentSat, e: editing
      }));
      sessionStorage.setItem("galaxy:saved", "1");
    }catch(e){}

    api.publish(buildDoc(STATE)).then(function(){
      savemsg.textContent = "已儲存，重新載入…";
    }).catch(function(err){
      var code = (err && err.code) || "upstream_error";
      saving = false;
      try{ sessionStorage.removeItem("galaxy:saved"); }catch(e){}
      if(code === "conflict"){
        savemsg.textContent = "有更新的版本，畫面正在重新載入";
        return;
      }
      savebtn.disabled = false; discard.disabled = false;
      if(code === "not_writer" || code === "not_granted" || code === "consent_required"
         || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        readOnly("這個檢視只能看，改動沒辦法存起來");
      } else if(code === "rate_limited"){
        savemsg.textContent = "存太密集了，等幾秒再按一次儲存";
      } else if(code === "too_large"){
        savemsg.textContent = "內容太大了，存不進去";
      } else {
        savemsg.textContent = "存檔失敗，再按一次儲存試試";
      }
    });
  }

  savebtn.addEventListener("click", save);
  discard.addEventListener("click", function(){
    if(!dirty) return;
    dirty = false;
    savemsg.textContent = "還原中…";
    location.reload();
  });

  document.addEventListener("keydown", function(e){
    if((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")){
      if(dirty && canWrite){ e.preventDefault(); save(); }
      return;
    }
    if(e.key !== "Escape" || !open) return;
    if(currentSat) selectSat(null); else exit();
  });

  window.addEventListener("beforeunload", function(e){
    if(!dirty || saving) return;
    e.preventDefault();
    e.returnValue = "";
  });

  /* ── 小工具 ───────────────────────── */
  var DOW = ["日","一","二","三","四","五","六"];
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function todayKey(){
    var n = new Date();
    return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate());
  }
  function scheduleHtml(list){
    var today = todayKey();
    return '<ul class="sched">' + list.map(function(s){
      var q = s.d.split("-");
      var dt = new Date(+q[0], +q[1]-1, +q[2]);
      var cls = (s.t === "貼文" ? "post" : "reel");
      if(s.d === today) cls += " today"; else if(s.d < today) cls += " done";
      return '<li class="'+cls+'"><span class="date">'+(+q[1])+"/"+(+q[2])+'</span>'
           + '<span class="dow">週'+DOW[dt.getDay()]+'</span>'
           + '<span class="kind">'+esc(s.t)+'</span></li>';
    }).join("") + '</ul>';
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function exit(){
    open = false; currentSat = null;
    uni.classList.remove("on");
    document.body.classList.remove("locked");
    if(lastFocus) lastFocus.focus();
  }
  back.addEventListener("click", exit);

  /* ── 回到存檔前的位置 ───────────────────────── */
  if(restore && restore.p){
    var target = PLANETS.filter(function(x){ return x.id === restore.p; })[0];
    if(target){
      lastFocus = nodes[PLANETS.indexOf(target)];
      enter(target);
      if(restore.s) selectSat(restore.s);
    }
  }

  /* ── 取得存檔能力 ───────────────────────── */
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(a){
      if(!a) return;
      api = a; canWrite = true;
      hint.textContent = "點任一顆星球進入 · 清單可以直接編輯";
      try{
        if(localStorage.getItem("galaxy:editing") === "1") editing = true;
      }catch(e){}
      if(restore && typeof restore.e === "boolean") editing = restore.e;
      renderSat();
      try{
        if(sessionStorage.getItem("galaxy:saved")){
          sessionStorage.removeItem("galaxy:saved");
          flash("已儲存");
        }
      }catch(e){}
    }).catch(function(){});
  }
})();
</script>
